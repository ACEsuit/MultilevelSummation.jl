# Standalone environment for the end-to-end scaling study.
# NOT part of the standard `]test` target or the PkgBenchmark suite.
#
# Usage (CPU only):
#   julia --project=scaling -e 'using Pkg; Pkg.develop(path=".")'
#   julia -t auto --project=scaling scaling/scan.jl --label cpu-auto
#
# Usage (CPU + GPU): add the framework for your hardware to this env:
#   julia --project=scaling -e 'using Pkg; Pkg.add("CUDA")'      # or AMDGPU, Metal, oneAPI
#   julia --project=scaling scaling/scan.jl --label a100
#
# CSVs land in scaling/results/scaling-<label>-<date>.csv.

[deps]
MultilevelSummation = "8c6e5870-99c4-4685-beb5-7acb5afddbe8"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
